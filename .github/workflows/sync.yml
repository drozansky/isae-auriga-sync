name: Auriga Timetable Sync

on:
  schedule:
    # Run every 2 hours from 06:00 to 20:00 UTC (08:00 to 22:00 CET), Monday to Friday
    - cron: '0 6-20/2 * * 1-5'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run sync
        run: python sync.py
        env:
          SCHOOL_USERNAME: ${{ secrets.SCHOOL_USERNAME }}
          SCHOOL_PASSWORD: ${{ secrets.SCHOOL_PASSWORD }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Upload Debug Screenshot on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug_screen.png
          if-no-files-found: ignore